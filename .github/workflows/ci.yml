name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (region ${{ matrix.region.name }}, Node ${{ matrix.node.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # One pipeline, region matrix (marketplace ADR-0003 decision 8). A Region Stack is added
        # here together with its config/markets/<CODE>.json.
        region:
          - name: au
            hosted_markets: AU
        # The exact minimum of `engines` in package.json, and the version in .nvmrc.
        node:
          - label: minimum
            version: 24.20.0
          - label: .nvmrc
            version-file: .nvmrc

    services:
      # Same image as docker-compose.yml. The image installs its PostGIS extensions into
      # POSTGRES_DB (`postgres`); the bootstrap step creates `drive` from template1.
      postgres:
        image: postgis/postgis:17-3.5-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Live courier positions (tracking) and the route cache (routing); the Redis integration
      # test in test:db reads REDIS_URL.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # Job level holds only what the application may see. MIGRATION_DATABASE_URL is set on the
    # steps that need it, never here, so the boot probe runs without it.
    env:
      DATABASE_URL: postgresql://drive_api:drive_api@localhost:5432/drive
      HOSTED_MARKETS: ${{ matrix.region.hosted_markets }}
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      # A service container cannot mount a repository file, so the bootstrap runs here. The
      # second run is the existing-database path: the files must converge, not fail.
      - name: Create the database and its roles (cluster bootstrap)
        run: |
          container="${{ job.services.postgres.id }}"
          docker cp scripts/db/init-drive-database.sh "$container":/tmp/init-drive-database.sh
          docker cp scripts/db/bootstrap-dev.sql "$container":/tmp/bootstrap-dev.sql
          for run in 1 2; do
            docker exec "$container" sh /tmp/init-drive-database.sh
          done

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # One of the two is set per matrix entry; node-version wins when both are set.
          node-version: ${{ matrix.node.version }}
          node-version-file: ${{ matrix.node.version-file }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      # Typecheck, lint, architecture boundaries, tests, database tests and the
      # up -> down -> up migration check: the same command developers run locally.
      - name: Verify
        run: pnpm verify
        env:
          MIGRATION_DATABASE_URL: postgresql://drive_migrator:drive_migrator@localhost:5432/drive
          REDIS_URL: redis://localhost:6379
          # Fewer database spec files at once than Jest's default (cores - 1), as in the
          # marketplace: under full parallel load a unit sometimes could not start in time.
          TEST_DB_MAX_WORKERS: '2'

      - name: Build
        run: pnpm build

      - name: Apply migrations
        run: pnpm db:migrate
        env:
          MIGRATION_DATABASE_URL: postgresql://drive_migrator:drive_migrator@localhost:5432/drive

      # Job environment only: this process has no migration URL, and its start-up self-check
      # refuses any role but the application login.
      - name: Boot the API for this region, probe readiness and the security headers
        run: |
          APP_ROLE=api PORT=3100 node apps/api/dist/main &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:3100/health/ready; then
              node scripts/check-http-headers.mjs http://localhost:3100
              exit $?
            fi
            sleep 1
          done
          echo "API did not become ready" >&2
          exit 1

      # The worker role opens no port and exits 0 on SIGTERM (main.ts handles the signal itself;
      # exit 143 would mean no handler ran).
      - name: Boot the worker role, check it opens no port and stops on SIGTERM
        run: |
          APP_ROLE=worker PORT=3101 node apps/api/dist/main &
          worker=$!
          sleep 8
          kill -0 "$worker" || { echo "Worker exited early" >&2; exit 1; }
          if ss -ltnp | grep -q "pid=$worker,"; then
            echo "Worker opened a listening port" >&2
            ss -ltnp | grep "pid=$worker," >&2
            exit 1
          fi
          kill -TERM "$worker"
          wait "$worker" || { echo "Worker did not stop cleanly on SIGTERM" >&2; exit 1; }

      # The only step that runs docker-compose.yml's PostgreSQL: the init-directory path of the
      # bootstrap and `pnpm db:bootstrap`. Port 5434 keeps it apart from the service container.
      - name: Compose smoke (PostgreSQL only)
        env:
          POSTGRES_PORT: '5434'
        run: |
          docker compose up -d --wait postgres
          state=$(docker compose exec -T postgres psql -U postgres -d drive -Atc "
            SELECT (SELECT count(*) FROM pg_roles
                     WHERE rolname IN ('drive_app', 'drive_api', 'drive_migrator')
                       AND NOT rolsuper)
                   || ' ' || pg_get_userbyid(datdba)
                   || ' ' || (SELECT count(*) FROM pg_extension WHERE extname = 'postgis')
              FROM pg_database WHERE datname = current_database()")
          if [ "$state" != "3 drive_migrator 1" ]; then
            echo "The Compose bootstrap left roles, owner and PostGIS as: $state" >&2
            exit 1
          fi
          pnpm db:bootstrap

      - name: Compose smoke clean-up
        if: always()
        env:
          POSTGRES_PORT: '5434'
        run: |
          if [ "${{ job.status }}" != "success" ]; then docker compose logs postgres || true; fi
          docker compose down -v

  # Handoff 35: the courier app's smoke run on a real API, for AU and ZZ. `pnpm dev:seed` fills a
  # `_test` database through the real routes (first admin, merchant, approved courier, one
  # assigned delivery); the built API serves it with the same local Market configuration; the
  # app's HTTP adapter walks that delivery from sign-in to delivered and sign-out. ZZ goes first:
  # the anonymous identity limit counts per client address across Markets, and ZZ's is lower.
  courier-smoke:
    name: Courier smoke run (AU and ZZ)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgis/postgis:17-3.5-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://drive_api:drive_api@localhost:5432/drive_test
      HOSTED_MARKETS: AU,ZZ
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      # The seed refuses a database whose name does not end in _dev or _test.
      - name: Create the drive_test database and its roles
        run: |
          container="${{ job.services.postgres.id }}"
          docker cp scripts/db/bootstrap-dev.sql "$container":/tmp/bootstrap-dev.sql
          docker exec "$container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
            -c 'CREATE DATABASE drive_test TEMPLATE template1'
          docker exec "$container" psql -v ON_ERROR_STOP=1 -q -U postgres -d drive_test \
            -f /tmp/bootstrap-dev.sql

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the API and apply migrations
        run: |
          pnpm --filter @mondapac-drive/shared-kernel build
          pnpm --filter @mondapac-drive/api build
          pnpm db:migrate
        env:
          MIGRATION_DATABASE_URL: postgresql://drive_migrator:drive_migrator@localhost:5432/drive_test

      # The local Market configuration (scripts/dev-config.mjs), shared by the seed and the API.
      - name: Write the local Market configuration
        run: node scripts/dev-config.mjs >> "$GITHUB_ENV"

      - name: Start the API
        run: |
          APP_ROLE=api PORT=3100 node apps/api/dist/main > api.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --silent --fail http://localhost:3100/health/ready > /dev/null && exit 0
            sleep 1
          done
          echo "API did not become ready" >&2
          exit 1

      - name: Seed and smoke-run ZZ
        env:
          DEV_SEED_SKIP_BUILD: '1'
        run: |
          pnpm dev:seed --market ZZ --samples 0
          pnpm smoke:courier --market ZZ

      - name: Seed and smoke-run AU
        env:
          DEV_SEED_SKIP_BUILD: '1'
        run: |
          pnpm dev:seed --market AU --samples 0
          pnpm smoke:courier --market AU

      # A second seed of the same database refuses, and so does a database without the suffix
      # or an environment that is not development or test: the seed never runs elsewhere.
      - name: The seed refuses a repeat, another database and production
        env:
          DEV_SEED_SKIP_BUILD: '1'
        run: |
          refuses() {
            if "$@" > refusal.log 2>&1; then echo "The seed ran: $*" >&2; exit 1; fi
            grep -E "$expected" refusal.log > /dev/null || { cat refusal.log >&2; exit 1; }
          }
          expected='already has its first admin' refuses pnpm dev:seed --market AU --samples 0
          expected='must end in _dev or _test' \
            DATABASE_URL=postgresql://drive_api:drive_api@localhost:5432/drive \
            refuses pnpm dev:seed --market AU
          expected='NODE_ENV must be set' NODE_ENV=production refuses pnpm dev:seed --market AU

      - name: API log
        if: failure()
        run: tail -n 200 api.log || true
