# Local development dependencies only: PostgreSQL with PostGIS and Redis. Ports differ from the
# marketplace's (5432, 6379) so both stacks can run side by side. Credentials are local-only
# defaults and every port is bound to 127.0.0.1.
name: mondapac-drive

services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: drive
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d drive']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: mirror.gcr.io/library/redis:7-alpine
    ports:
      - '127.0.0.1:${REDIS_PORT:-6380}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
